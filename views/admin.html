<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت MangaNova</title><link rel="stylesheet" href="/css/style.css">
<style>
:root{--a:#9a4dff;--p:#11111a;--p2:#181824;--l:#2a2936}
body{background:radial-gradient(circle at 80% 0,rgba(139,61,255,.18),transparent 30%),#08080d!important;color:#f6f6fa!important}
.wrap{max-width:1180px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px}
h1,h2{letter-spacing:-.3px}
.sec{background:linear-gradient(145deg,#11111a,#0d0d13);border:1px solid #ffffff0d;border-radius:20px;padding:22px;margin:18px 0}
.form input,.form textarea,.form select,input,textarea,select{background:#0b0b11!important;border-color:#ffffff12!important;color:#f6f6fa!important}
button.primary,.primary{background:linear-gradient(135deg,#a653ff,#7b2ff7)!important;color:#fff!important}
.stat{background:#171722!important;border:1px solid #ffffff0b}
.chapter,.item,.chapter-row{background:#0c0c12!important;border-color:#ffffff0d!important}
.danger{background:#7d2430!important;color:#fff!important}
@media(max-width:700px){.wrap{width:min(100% - 20px,1180px)}.sec{padding:16px;border-radius:16px}}
</style>
</head><body><main class="wrap sec"><div class="head"><h1>پنل مدیریت</h1><a href="/">← سایت</a></div><div id="stats"></div><section class="sec"><h2>افزودن اثر</h2><form id="workForm" class="form" enctype="multipart/form-data"><input name="title" placeholder="عنوان فارسی" required><input name="english_title" placeholder="عنوان انگلیسی"><textarea name="description" placeholder="خلاصه داستان"></textarea><select name="kind"><option>مانهوا</option><option>مانگا</option><option>مانها</option><option>کمیک</option><option>ناول</option></select><input name="status" placeholder="وضعیت" value="در حال انتشار"><input name="genres" placeholder="ژانرها با ویرگول"><input name="cover" type="file" accept="image/*"><button class="primary">ثبت اثر</button></form></section><section class="sec"><h2>افزودن فصل و تصاویر</h2><form id="chapterForm" class="form" enctype="multipart/form-data"><select name="work_id" id="workSelect"></select><input name="title" placeholder="عنوان فصل" required><input name="number" type="number" step="0.1" placeholder="شماره فصل" required><input name="pages" type="file" accept="image/*" multiple><div style="text-align:center;opacity:.7">یا</div><input name="zip" type="file" accept=".zip,application/zip"><button class="primary">آپلود فصل</button></form><p>می‌توانی چند تصویر را مستقیم انتخاب کنی یا کل صفحات یک فصل را به صورت ZIP آپلود کنی. نام فایل‌ها برای مرتب‌سازی عددی استفاده می‌شود: 001.jpg، 002.jpg و ...</p></section><section class="sec"><h2>آثار</h2><div id="list"></div></section><script>
const $=s=>document.querySelector(s);async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function refresh(){let s=await api("/api/admin/stats");$("#stats").innerHTML=`<span class="stat">کاربر: ${s.users}</span><span class="stat">اثر: ${s.works}</span><span class="stat">فصل: ${s.chapters}</span><span class="stat">صفحه: ${s.pages}</span>`;let d=await api("/api/works");$("#workSelect").innerHTML=d.works.map(w=>`<option value="${w.id}">${w.title}</option>`).join("");$("#list").innerHTML=d.works.map(w=>`<div class="chapter"><b>${w.title}</b> — ${w.chapter_count} فصل <button onclick="delWork(${w.id})">حذف</button></div>`).join("")}
$("#workForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/work",{method:"POST",body:new FormData(e.target)});e.target.reset();refresh()}catch(x){alert(x.message)}};$("#chapterForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/work/"+$("#workSelect").value+"/chapter",{method:"POST",body:new FormData(e.target)});e.target.reset();refresh();alert("فصل با موفقیت آپلود شد و صفحات آماده مطالعه هستند.")}catch(x){alert(x.message)}};async function delWork(id){if(confirm("حذف شود؟")){await api("/api/admin/work/"+id,{method:"DELETE"});refresh()}}refresh();
</script></main></body></html>
